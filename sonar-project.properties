# SonarCloud — usado apenas quando SONAR_TOKEN está configurado (estratégia S1).
# Ajuste organization/projectKey à sua conta SonarCloud antes do primeiro scan.
sonar.projectKey=rmatos-pg_Dev-Fullstack-Pleno-Desafio
sonar.organization=rmatos-pg
sonar.projectName=oee-challenge

sonar.sources=packages,services
sonar.tests=packages,services
sonar.test.inclusions=**/*.test.ts
